  <style>
    <![CDATA[
    .bg { fill: #0d1117; stroke: #1d4ed8; stroke-width: 2; rx: 8px; }
    .blue-main { fill: #38bdf8; font-family: monospace; font-size: 13px; white-space: pre; }
    .blue-accent { fill: #60a5fa; font-family: monospace; font-size: 13px; font-weight: bold; white-space: pre; }
    .blue-dark { fill: #1e40af; font-family: monospace; font-size: 13px; white-space: pre; }
    .blue-light { fill: #93c5fd; font-family: monospace; font-size: 13px; white-space: pre; }
    
    .animated-fade {
      animation: fadeIn 2s ease-in-out infinite alternate;
    }
    .cursor {
      fill: #38bdf8;
      animation: blink 0.8s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes fadeIn { from { opacity: 0.6; } to { opacity: 1; } }
    ]]>
  </style>

